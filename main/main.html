<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomy Layout</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <a href="#art">ART</a> |
        <a href="#horror">HORROR</a> |
        <a href="#blog">BLOG</a> |
        <a href="#fun">FUN</a> |
        <a href="#about">ABOUT</a> |
        <a href="#links">LINKS</a> |
        <a href="#sitemap">SITEMAP</a>
    </nav>

    <main class="container">
        <!-- Left Panel: Interactive Body Map -->
        <section class="interactive-body">
            <div class="body-container">
                <!-- Base body image (you will need to provide the actual image asset) -->
                <img src="body-background.png" alt="Human Body Outline" class="body-img">
                
                <!-- Clickable labels mapped to organ positions -->
                <button class="organ-btn" id="btn-music" style="top: 32%; left: 25%;">Music</button>
                <button class="organ-btn" id="btn-interests" style="top: 32%; left: 75%;">Interests</button>
                <button class="organ-btn" id="btn-home" style="top: 42%; left: 50%;">Home</button>
                <button class="organ-btn" id="btn-community" style="top: 65%; left: 20%;">Community</button>
                <button class="organ-btn" id="btn-guestbook" style="top: 65%; left: 80%;">Guestbook</button>
                <button class="organ-btn" id="btn-contact" style="top: 73%; left: 50%;">Contact</button>
                <button class="organ-btn" id="btn-rings" style="top: 90%; left: 50%;">Rings/cliques</button>
            </div>
        </section>

        <!-- Right Panel: Dynamic Content Window -->
        <section class="content-window">
            <div class="tray-background">
                <!-- The iframe loads the specific pages based on button clicks -->
                <iframe id="content-frame" src="home.html" title="Content Window"></iframe>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
