<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sammylux's Morgue</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!--nav-->
    <nav class="top-nav">
        <a href="#art" class="myButton">ART</a>
        <a href="#horror" class="myButton">HORROR</a>
        <a href="#blog" class="myButton">BLOG</a>
        <a href="#fun" class="myButton">FUN</a>
        <a href="#about" class="myButton">ABOUT</a>
        <a href="#links" class="myButton">LINKS</a>
        <a href="#sitemap" class="myButton">SITEMAP</a>
    </nav>

    <main class="container">
    <!--left panel-->
        <section class="interactive-body">
            <div class="body-container">
                <img src="https://file.garden/Zd2KO2NjlENDwhxN/site%202.0/torso%20placeholders/chest%20marks.png" alt="corpse" class="body-img">
            
                <!--organs-->
                <button class="organ-btn" id="btn-music" style="top: 28%; left: 32%;" title="Music">
                    <img src="organ-lungs.png" alt="Music (Lungs)">
                </button>
                <button class="organ-btn" id="btn-interests" style="top: 28%; left: 68%;" title="Interests">
                    <img src="organ-heart.png" alt="Interests (Heart)">
                </button>
                <button class="organ-btn" id="btn-home" style="top: 38%; left: 50%;" title="Home">
                    <img src="organ-liver.png" alt="Home (Liver)">
                </button>
                <button class="organ-btn" id="btn-community" style="top: 55%; left: 28%;" title="Community">
                    <img src="organ-kidney-left.png" alt="Community (Left Kidney)">
                </button>
                <button class="organ-btn" id="btn-guestbook" style="top: 55%; left: 72%;" title="Guestbook">
                    <img src="organ-kidney-right.png" alt="Guestbook (Right Kidney)">
                </button>
                <button class="organ-btn" id="btn-contact" style="top: 66%; left: 50%;" title="Contact">
                    <img src="organ-stomach.png" alt="Contact (Stomach)">
                </button>
                <button class="organ-btn" id="btn-rings" style="top: 82%; left: 50%;" title="Rings/Cliques">
                    <img src="organ-intestines.png" alt="Rings/Cliques (Intestines)">
                </button>
            </div>
        </section>

        <!--right panel-->
        <section class="content-window">
            <div class="tray-background">
                <iframe id="content-frame" src="home.html" title="Content Window"></iframe>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
